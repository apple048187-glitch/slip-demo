<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>出貨單示範</title>
<style>
  body { font-family: system-ui, "Noto Sans TC", "Microsoft JhengHei", sans-serif; margin: 0; padding: 16px; background: #f5f5f5; color: #222; font-size: 16px; }
  .wrap { max-width: 720px; margin: 0 auto; }
  .card { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  h1 { font-size: 20px; margin: 0 0 12px; }
  h2 { font-size: 17px; margin: 0 0 10px; }
  label { display: block; font-size: 14px; color: #555; margin-top: 8px; }
  select, input { width: 100%; box-sizing: border-box; font-size: 16px; padding: 8px; border: 1px solid #bbb; border-radius: 6px; margin-top: 4px; }
  .line { border: 1px solid #e5e5e5; border-radius: 8px; padding: 10px; margin-bottom: 10px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .ro { background: #f0f0f0; }
  button, .btn { display: inline-block; font-size: 16px; padding: 10px 14px; border: 0; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; margin: 6px 6px 0 0; text-decoration: none; }
  button.sec, .btn.sec { background: #6b7280; }
  .err { color: #b91c1c; min-height: 1.2em; margin-top: 8px; }
  .pw { font-size: 36px; font-weight: bold; letter-spacing: 6px; text-align: center; margin: 12px 0; }
  .slip-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 14px; }
  .slip-table th, .slip-table td { border-bottom: 1px solid #ccc; padding: 4px; text-align: left; }
  .num { text-align: right; }
  .hidden { display: none; }
  .meta { font-size: 15px; line-height: 1.7; }
  @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">

  <!-- 1. 輸入 -->
  <div class="card" id="form-card">
    <h1>出貨單示範（本倉 → 外倉）</h1>
    <label>出貨時間 <input type="datetime-local" id="when"></label>
    <label>經手人 <input type="text" id="handler" placeholder="例如：王小明"></label>
    <label>解密網頁網址（手機要能打開的網址，例如 https://你的網站/slip_demo.html）
      <input type="text" id="viewer-base" placeholder="https://...">
    </label>
    <div id="lines"></div>
    <button class="sec" id="add-line">＋ 新增品項</button>
    <div style="margin-top:10px;"><b>合計：</b><span id="total">0 板 / 0 箱</span> <span style="color:#666;">（上限 14 板）</span></div>
    <div class="err" id="err"></div>
    <button id="make">產生身份單與 QR</button>
  </div>

  <!-- 2. 產出結果：身份單檔、QR 檔 -->
  <div class="card hidden" id="result-card">
    <h2>已產生</h2>
    <div>單號：<b id="result-no"></b></div>
    <div>車次密碼（告訴司機，不印在身份單上）：</div>
    <div class="pw" id="pw-show"></div>
    <a class="btn" id="dl-slip" href="#" download>下載身份單（HTML，可列印）</a>
    <a class="btn" id="dl-qr" href="#" download>下載 QR 圖（PNG）</a>
    <button class="sec" onclick="backToForm()">重新輸入</button>
    <div style="margin-top:12px;color:#555;font-size:14px;">
      身份單檔案可直接打開列印，或另存 PDF。QR 圖貼在外箱上，司機掃描後會看到輸入密碼的畫面。
    </div>
  </div>

  <!-- 3. 解密（掃到 QR 時顯示） -->
  <div class="card hidden" id="viewer-card">
    <div id="gate">
      <h1>請輸入車次密碼</h1>
      <input id="pw-in" type="password" inputmode="numeric" autocomplete="off" placeholder="密碼">
      <button id="open">開啟身份單</button>
      <div class="err" id="v-err"></div>
    </div>
    <div id="viewed" class="hidden"></div>
  </div>
</div>

<script>
/* ---------- 示範品項（條碼與貨號為示範值） ---------- */
const PRODUCTS = [
  { code: 'ABR 1000ML-6入', name: '大紅高高粱酒58/1000ml-6入', barcode: '4710000000011', itemNo: 'A-1001', casesPerPallet: 30 },
  { code: 'BN 1000ML-6入', name: '潘朵拉冰鎮紅酒8/1000ml-6入', barcode: '4710000000028', itemNo: 'B-2001', casesPerPallet: 30 },
  { code: 'BPL 300ML-12入', name: '潘朵拉梅酒12/300ml-12入', barcode: '4710000000035', itemNo: 'P-3001', casesPerPallet: 30 },
];
const PMAP = Object.fromEntries(PRODUCTS.map(p => [p.code, p]));
const MAX_PALLETS = 14;
const ITER = 200000;

/* ---------- 加解密（PBKDF2-SHA256 + AES-256-GCM） ---------- */
function toB64u(bytes) {
  let s = ''; bytes.forEach(b => s += String.fromCharCode(b));
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function fromB64u(s) {
  let t = s.replace(/-/g, '+').replace(/_/g, '/'); while (t.length % 4) t += '=';
  return Uint8Array.from(atob(t), c => c.charCodeAt(0));
}
async function keyFor(pw, salt) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: ITER, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function encryptSlip(slip, pw) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await keyFor(pw, salt);
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key,
    new TextEncoder().encode(JSON.stringify(slip))));
  const blob = new Uint8Array(28 + ct.length);
  blob.set(salt, 0); blob.set(iv, 16); blob.set(ct, 28);
  return toB64u(blob);
}
async function decryptSlip(payload, pw) {
  const blob = fromB64u(payload);
  const key = await keyFor(pw, blob.slice(0, 16));
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: blob.slice(16, 28) }, key, blob.slice(28));
  return JSON.parse(new TextDecoder().decode(pt));
}

/* ---------- 工具 ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
function randomPw() { return String(Math.floor(100000 + Math.random() * 900000)); }
function nowLocalInput() {
  const d = new Date(Date.now() - new Date().getTimezoneOffset() * 60000);
  return d.toISOString().slice(0, 16);
}
function makeQr(text) {
  const box = document.createElement('div');
  QrCreator.render({ text: text, ecLevel: 'M', size: 300, radius: 0, fill: '#000', background: '#fff', quiet: 2 }, box);
  return box.querySelector('canvas').toDataURL('image/png');
}
function itemRows(items) {
  return items.map((it, i) => `
    <tr><td>${i + 1}</td><td>${esc(it.code)}</td><td>${esc(it.itemNo)}</td><td>${esc(it.barcode)}</td>
    <td>${esc(it.name)}</td><td class="num">${it.pallets}</td><td class="num">${it.cases}</td></tr>`).join('');
}

/* 身份單內容（不含密碼、不含 QR） */
function slipBodyHtml(s) {
  return `
    <h2>出貨身份單</h2>
    <div class="meta">
      單號：${esc(s.no)}<br>
      日期時間：${esc(s.datetime)}　經手人：${esc(s.handler)}<br>
      路線：${esc(s.route)}
    </div>
    <table class="slip-table">
      <tr><th>#</th><th>品號</th><th>貨號</th><th>條碼</th><th>品名</th><th class="num">板</th><th class="num">箱</th></tr>
      ${itemRows(s.items)}
      <tr><td></td><td><b>合計</b></td><td></td><td></td><td></td>
      <td class="num"><b>${s.totalPallets}</b></td><td class="num"><b>${s.totalCases}</b></td></tr>
    </table>
    <div style="margin-top:16px;">司機簽收：____________　外倉收貨：____________</div>`;
}

/* 獨立的身份單檔案（HTML，列印用） */
function buildSlipFile(s) {
  return `<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>出貨身份單 ${esc(s.no)}</title>
<style>
  body { font-family: system-ui, "Noto Sans TC", "Microsoft JhengHei", sans-serif; margin: 24px; color: #222; font-size: 14px; }
  h2 { font-size: 20px; margin: 0 0 10px; }
  .meta { line-height: 1.8; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th, td { border-bottom: 1px solid #ccc; padding: 5px; text-align: left; }
  .num { text-align: right; }
  @media print { body { margin: 10mm; } }
</style></head>
<body>${slipBodyHtml(s)}</body></html>`;
}

function downloadBlob(filename, blob) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* ---------- 1. 輸入 ---------- */
function addLine() {
  const div = document.createElement('div');
  div.className = 'line';
  div.innerHTML = `
    <label>品項<select class="sel"><option value="">請選擇</option>${PRODUCTS.map(p =>
      `<option value="${esc(p.code)}">${esc(p.code)} ${esc(p.name)}</option>`).join('')}</select></label>
    <div class="grid">
      <label>條碼<input class="ro bc" readonly></label>
      <label>貨號<input class="ro io" readonly></label>
      <label>板數<input type="number" min="1" class="pal"></label>
      <label>箱數（自動）<input class="ro cs" readonly></label>
    </div>
    <button class="sec rm" type="button">刪除</button>`;
  $('lines').appendChild(div);
  const refresh = () => { fill(div); total(); };
  div.querySelector('.sel').addEventListener('change', refresh);
  div.querySelector('.pal').addEventListener('input', refresh);
  div.querySelector('.rm').addEventListener('click', () => { div.remove(); total(); });
}
function fill(div) {
  const p = PMAP[div.querySelector('.sel').value];
  const pal = Number(div.querySelector('.pal').value) || 0;
  div.querySelector('.bc').value = p ? p.barcode : '';
  div.querySelector('.io').value = p ? p.itemNo : '';
  div.querySelector('.cs').value = p && pal ? pal * p.casesPerPallet : '';
}
function collect() {
  return [...document.querySelectorAll('#lines .line')].map(div => {
    const p = PMAP[div.querySelector('.sel').value];
    const pal = Number(div.querySelector('.pal').value) || 0;
    return p && pal ? { p, pallets: pal, cases: pal * p.casesPerPallet } : null;
  }).filter(Boolean);
}
function total() {
  const L = collect();
  const pal = L.reduce((a, b) => a + b.pallets, 0);
  const cs = L.reduce((a, b) => a + b.cases, 0);
  $('total').textContent = `${pal} 板 / ${cs} 箱`;
  $('total').style.color = pal > MAX_PALLETS ? '#b91c1c' : '';
}
$('add-line').addEventListener('click', addLine);

/* ---------- 2. 產生 ---------- */
$('make').addEventListener('click', async () => {
  try {
    await makeSlip();
  } catch (e) {
    $('err').textContent = '產生失敗：' + e.message;
    console.error(e);
  }
});

async function makeSlip() {
  if (!window.crypto || !crypto.subtle) {
    throw new Error('此瀏覽器不支援加密功能，請用最新版 Chrome 或 Edge 開啟（需要 https 或本機檔案）');
  }
  $('err').textContent = '';
  const L = collect();
  if (!L.length) return $('err').textContent = '請至少輸入一個品項與板數';
  const pal = L.reduce((a, b) => a + b.pallets, 0);
  if (pal > MAX_PALLETS) return $('err').textContent = `合計 ${pal} 板，超過上限 ${MAX_PALLETS} 板`;

  const slip = {
    no: 'OUT-DEMO-' + Date.now().toString().slice(-6),
    datetime: $('when').value.replace('T', ' ') || '未填',
    handler: $('handler').value.trim() || '未填',
    route: '本倉 → 外倉',
    totalPallets: pal,
    totalCases: L.reduce((a, b) => a + b.cases, 0),
    items: L.map(l => ({ code: l.p.code, name: l.p.name, barcode: l.p.barcode, itemNo: l.p.itemNo, pallets: l.pallets, cases: l.cases })),
  };
  const pw = randomPw();
  const payload = await encryptSlip(slip, pw);
  let base = $('viewer-base').value.trim();
  if (!base && /^https?:/.test(location.protocol)) base = location.href.split('#')[0];
  if (!base || !/^https:\/\/|^http:\/\//.test(base)) {
    throw new Error('請先在「解密網頁網址」填入手機能打開的網址（https 開頭）。電腦上的本機檔案手機打不開，掃描會找不到資料');
  }
  const qrUrl = base.split('#')[0] + '#' + payload;
  const qrPng = makeQr(qrUrl);

  // 身份單檔案
  const slipHtml = buildSlipFile(slip);
  const slipUrl = URL.createObjectURL(new Blob([slipHtml], { type: 'text/html;charset=utf-8' }));
  $('dl-slip').href = slipUrl;
  $('dl-slip').download = `${slip.no}_身份單.html`;
  // QR 檔案
  $('dl-qr').href = qrPng;
  $('dl-qr').download = `${slip.no}_QR.png`;

  $('result-no').textContent = slip.no;
  $('pw-show').textContent = pw;
  $('form-card').classList.add('hidden');
  $('viewer-card').classList.add('hidden');
  $('result-card').classList.remove('hidden');
}

function backToForm() {
  $('result-card').classList.add('hidden');
  $('form-card').classList.remove('hidden');
}

/* ---------- 3. 掃到 QR（網址帶 #密文）時，進入解密畫面 ---------- */
function showViewer(payload) {
  $('form-card').classList.add('hidden');
  $('result-card').classList.add('hidden');
  $('viewer-card').classList.remove('hidden');
  $('open').onclick = async () => {
    $('v-err').textContent = '';
    try {
      const s = await decryptSlip(payload, $('pw-in').value);
      $('gate').classList.add('hidden');
      $('viewed').innerHTML = slipBodyHtml(s);
      $('viewed').classList.remove('hidden');
    } catch (e) {
      $('v-err').textContent = '密碼錯誤或資料損毀';
    }
  };
}

/* ---------- 初始化 ---------- */
$('when').value = nowLocalInput();
addLine();
const hash = location.hash.slice(1);
if (hash) showViewer(hash);
</script>
</body>
</html>
